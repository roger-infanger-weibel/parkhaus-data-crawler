<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkhaus KI-Prognose</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark px-3 mb-4">
  <a class="navbar-brand" href="/">🅿️ Parkhaus <span>KI</span>-Prognose</a>
  <ul class="navbar-nav me-auto">
    <li class="nav-item"><a class="nav-link active" href="/">Prognose</a></li>
    <li class="nav-item"><a class="nav-link" href="/accuracy.html">Genauigkeit</a></li>
    <li class="nav-item"><a class="nav-link" href="/chat.html">Chat-Assistent</a></li>
    <li class="nav-item"><a class="nav-link" href="/doku.html">Dokumentation</a></li>
  </ul>
  <div class="dropdown me-3">
    <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button"
            data-bs-toggle="dropdown" aria-expanded="false">Links</button>
    <ul class="dropdown-menu dropdown-menu-end" id="link-menu"></ul>
  </div>
  <div class="env-box d-none">
    <select id="env-select" class="form-select form-select-sm w-auto">
      <option value="prod">Prod</option>
      <option value="test">Test</option>
    </select>
  </div>
</nav>

<div class="container-fluid px-4">
  <div class="row g-3 mb-3 align-items-end">
    <div class="col-auto">
      <label class="form-label mb-1" for="city-select">Stadt</label>
      <select id="city-select" class="form-select"></select>
    </div>
    <div class="col-auto">
      <label class="form-label mb-1 d-block">Modell</label>
      <div class="btn-group" role="group">
        <input type="radio" class="btn-check" name="model" id="model-ml" value="ml" checked>
        <label class="btn btn-outline-primary btn-sm" for="model-ml">KI-Modell</label>
        <input type="radio" class="btn-check" name="model" id="model-baseline" value="baseline">
        <label class="btn btn-outline-primary btn-sm" for="model-baseline">Basis (Durchschnitt)</label>
      </div>
    </div>
    <div class="col-auto">
      <label class="form-label mb-1" for="such-feld">Suche</label>
      <div class="input-group">
        <input type="search" id="such-feld" class="form-control" style="min-width:14rem"
               placeholder="Parkhaus oder Gruppe …" autocomplete="off">
        <button class="btn btn-outline-secondary" type="button" id="such-loeschen"
                title="Suche zurücksetzen">✕</button>
      </div>
      <small class="text-muted" id="such-treffer"></small>
    </div>
    <div class="col-auto ms-auto text-muted small" id="slot-info"></div>
  </div>

  <div class="row">
    <div class="col-lg-7">
      <div class="card mb-4">
        <div class="card-body p-2">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead>
              <tr>
                <th>Parkhaus</th>
                <th class="text-end text-secondary">−2 h</th>
                <th class="text-end text-secondary">−1 h</th>
                <th class="text-end">Frei jetzt</th>
                <th class="text-end">+1 h</th>
                <th class="text-end">+2 h</th>
                <th class="text-end">+4 h</th>
                <th class="text-end">+8 h</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="forecast-table"><tr><td colspan="9">Lade …</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card mb-3">
        <div class="card-body">
          <h6 id="detail-title" class="card-title">Parkhaus wählen für Detailansicht</h6>
          <canvas id="detail-chart" height="220"></canvas>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-body py-2" id="detail-weather"></div>
      </div>
      <div class="card mb-3">
        <div class="card-body py-2" id="detail-events"></div>
      </div>
    </div>
  </div>
  <footer id="app-footer" class="text-muted small py-4"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/forecast.js"></script>
</body>
</html>
